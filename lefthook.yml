# yaml-language-server: $schema=./node_modules/lefthook/schema.json
pre-commit:
  commands:
    biome:
      glob: "*.{js,ts,jsx,tsx,json,jsonc,css,astro}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    astro-check:
      glob: "*.{astro,ts}"
      run: pnpm typecheck
    actionlint:
      glob:
        - ".github/workflows/*.{yml,yaml}"
      run: actionlint {staged_files}
pre-push:
  parallel: false
  commands:
    precheck:
      run: pnpm precheck
commit-msg:
  commands:
    conventional:
      run: |
        msg=$(cat {1})
        if ! echo "$msg" | grep -qE "^(feat|fix|docs|style|refactor|perf|test|chore|ci|build|revert)(\(.+\))?: .+"; then
          echo "warn: commit message does not follow Conventional Commits (ignored)"
        fi
