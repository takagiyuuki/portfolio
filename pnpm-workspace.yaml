allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true
overrides:
  # astro 7.4 pulls in @emnapi/runtime 2.0.0-beta through rolldown's wasm binding, and pnpm
  # hands that beta to @astrojs/check's emnapi 1.x core as a peer, which breaks `astro check`.
  # The beta is only needed by the wasm32 binding, which no supported platform installs.
  '@emnapi/runtime': 1.11.3
